site_name: Francisco Jerónimo
site_description: Personal webpage of Francisco — projects, interests, and more.
site_url: https://franciscojeronimo.github.io/fjmmcj-online/

copyright: "© 2026 Francisco Jerónimo"

extra_css:
  - assets/stylesheets/extra.css

theme:
  name: material
  logo: assets/images/log_v1.png
  favicon: assets/images/favicon_v1.png
  palette:
    scheme: slate
    primary: indigo
    accent: deep purple
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Projects:
      - Soundboard: projects/soundboard.md
      - Python Tools: projects/python-tools.md
  - Interests:
      - Board Games: interests/board-games.md
      - Audio & Tech: interests/audio-tech.md
  - About Me: about.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - tables
  - attr_list

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/franciscojeronimo
    - icon: fontawesome/solid/dice
      link: https://boardgamegeek.com

